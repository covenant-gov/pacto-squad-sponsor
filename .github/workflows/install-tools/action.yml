name: Install tools common to all our actions
description: Install Foundry, pnpm, Node.js, and project dependencies for CI jobs

runs:
  using: composite
  steps:
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      with:
        version: v1.5.1

    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        version: 9

    - name: Use Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 20.x
        cache: 'pnpm'

    # Frozen lockfile + ignore lifecycle scripts: CI does not need husky prepare.
    # Dependencies already constrain builds via package.json pnpm.onlyBuiltDependencies.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
