name: CI

on: [push]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  ARBITRUM_RPC: ${{ secrets.ARBITRUM_RPC }}
  SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC }}

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: install-tools
        uses: ./.github/workflows/install-tools

      - name: Run tests
        shell: bash
        run: pnpm test:unit

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    environment: e2e
    env:
      MAINNET_RPC: ${{ secrets.MAINNET_RPC || vars.MAINNET_RPC }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: install-tools
        uses: ./.github/workflows/install-tools

      - name: Require mainnet RPC for fork tests
        run: |
          if [ -z "${MAINNET_RPC}" ]; then
            echo "::error::MAINNET_RPC is not set. Add repository secret MAINNET_RPC or e2e environment variable MAINNET_RPC."
            exit 1
          fi

      - name: Run tests
        run: pnpm test:integration

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v5
      - name: install-tools
        uses: ./.github/workflows/install-tools

      - name: Run Forge formatter and Solhint
        run: pnpm lint:check

      - name: Install and run Bulloak
        uses: smol-ninja/bulloak-toolchain@v2
        with:
          test-dir: 'test/unit'
